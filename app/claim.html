<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TankFul · claim</title>
<link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&family=Azeret+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* The phone claim page. Deadline first, what to do second, one button. Tokens: DESIGN.md. */
  :root { color-scheme: light; --paper: #f7f6f2; --paper-2: #efede7; --line: #d6d3ca; --ink: #1d2224; --ink-2: #4b5357; --ink-3: #646c70; --rail: #16413d; --rail-2: #0f302d; --rail-ink: #e7efe9; --rail-ink-2: #9fbfb4; --mint: #2d8f74; --mint-bg: #eaf5f0; --amber: #d9980f; --amber-bg: #fbf3df; --orange: #e3611c; --orange-bg: #fdf1e9; --red: #c7301f; --red-bg: #fbe9e6; --ui: "Geologica", "Helvetica Neue", Arial, sans-serif; --mono: "Azeret Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html { background: var(--rail); }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 400 16px/1.4 var(--ui); display: flex; flex-direction: column; }
  ::selection { background: #cfe3dc; }
  .bar { background: var(--rail); color: var(--rail-ink); padding: calc(14px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-left, 0px)) 22px max(22px, env(safe-area-inset-right, 0px)); }
  .bar .ttl { font-size: 13px; color: var(--rail-ink-2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar h1 { font: 600 26px/1.15 var(--ui); margin: 8px 0 4px; letter-spacing: -.015em; text-wrap: balance; }
  .bar .sub { font-size: 15px; color: var(--rail-ink-2); }
  .sev { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: #fff; background: var(--ink-3); }
  .sev.critical { background: var(--red); } .sev.high { background: var(--orange); } .sev.low { background: var(--amber); } .sev.ok { background: var(--mint); }
  main { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px max(22px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); max-width: 560px; width: 100%; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .cap { font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 10px; }
  .big { font: 600 40px/1 var(--ui); letter-spacing: -.02em; margin: 4px 0 0; color: var(--orange); font-variant-numeric: tabular-nums; }
  .big.ok { color: var(--mint); } .big.bad { color: var(--red); } .big.plain { color: var(--ink); font-size: 28px; }
  .big small { font-size: 15px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 8px; }
  .ruler { width: 100%; height: 48px; margin-top: 10px; display: block; }
  .todo { background: var(--orange-bg); border: 1px solid #f3cdb6; border-radius: 12px; padding: 16px 18px; }
  .todo.done { background: var(--mint-bg); border-color: #bfdfd3; } .todo.done .k { color: var(--mint); }
  .todo.calm { background: var(--amber-bg); border-color: #efdcae; } .todo.calm .k { color: #a4720a; }
  .todo.bad { background: var(--red-bg); border-color: #efc1ba; } .todo.bad .k { color: var(--red); }
  .todo .k { font-size: 12px; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: .05em; }
  .todo h2 { font: 600 21px/1.2 var(--ui); margin: 6px 0 4px; letter-spacing: -.01em; }
  .todo p { margin: 0; font-size: 15px; color: var(--ink-2); } .todo p b { color: var(--ink); font-weight: 500; }
  .rows { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--paper-2); font-size: 14px; }
  .row:first-child { border-top: 0; }
  .row span { color: var(--ink-2); }
  .row b { font-weight: 500; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .row.best b { color: var(--mint); }
  details { font-size: 14px; color: var(--ink-2); }
  summary { font-weight: 500; color: var(--ink); cursor: pointer; padding: 4px 0; }
  details .rows { margin-top: 10px; }
  .cta { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  button { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; font: 500 18px var(--ui); padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--rail); border-color: var(--rail); color: #fff; }
  button.quiet { height: 44px; border-color: transparent; background: transparent; color: var(--ink-2); font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  .result { font: 500 17px var(--ui); } .result .note { font-size: 14px; color: var(--ink-2); font-weight: 400; margin-top: 4px; }
  .foot { color: var(--ink-3); font-size: 12px; text-align: center; }
  .muted { color: var(--ink-3); }
</style>
</head>
<body>
<div id="app"><div class="bar"><div class="ttl">TankFul</div><h1>Loading…</h1></div></div>
<script>
const token = location.pathname.split('/').pop();
const qs = new URLSearchParams(location.search);
let view = null, result = null, acted = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = v => '$' + Math.round(v || 0).toLocaleString();
const hhmm = ts => ts ? ts.slice(11, 16) : '–';
const hmU = t => new Date(t * 1000).toISOString().slice(11, 16);
const unix = ts => ts ? Date.parse(ts) / 1000 : null;
async function load() {
  try { const r = await fetch('/api/alert/' + token, { cache: 'no-store' }); view = r.ok ? await r.json() : { error: (await r.json()).error }; }
  catch (e) { view = { error: 'No connection to the control server.' }; }
  render();
}
async function act(action) {
  acted = true;
  const r = await fetch('/api/claim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, action }) });
  result = await r.json(); await load();
}
// The page checks in every 60 s while open, so the system can skip people who have lost signal.
setInterval(() => fetch('/api/heartbeat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token }) }).catch(() => {}), 60000);
setInterval(load, 10000); // old notifications always show the alert's current state

// The deadline ruler: now, approve-by and shutdown on one line.
function ruler(now, by, shut) {
  const end = Math.max(shut || 0, by || 0, now + 1800) + 600, X = t => 8 + 334 * (t - now) / (end - now);
  let s = `<svg class="ruler" viewBox="0 0 350 48" aria-hidden="true"><line x1="8" y1="26" x2="342" y2="26" stroke="#d6d3ca" stroke-width="1.5"/>`;
  if (by) s += `<line x1="${X(by)}" y1="4" x2="${X(by)}" y2="36" stroke="#e3611c" stroke-width="2.5"/><text x="${X(by)}" y="46" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10" fill="#e3611c">${hmU(by)}</text>`;
  if (shut) s += `<line x1="${X(shut)}" y1="4" x2="${X(shut)}" y2="36" stroke="#c7301f" stroke-width="2.5"/><text x="${X(shut)}" y="46" text-anchor="${X(shut) > 320 ? 'end' : 'middle'}" font-family="Azeret Mono, monospace" font-size="10" fill="#c7301f">${hmU(shut)}</text>`;
  s += `<circle cx="8" cy="26" r="4.5" fill="#1d2224"/><text x="2" y="46" font-family="Azeret Mono, monospace" font-size="10" fill="#646c70">now</text></svg>`;
  return s;
}
const planTitle = P => {
  if (!P) return '';
  const tr = (P.actions || []).find(a => a.type === 'dispatch_truck'), sh = (P.actions || []).find(a => a.type === 'shut_in_wells');
  const parts = [];
  if (tr) parts.push(`Send ${tr.trucks} truck${tr.trucks > 1 ? 's' : ''}, ${tr.trips_per_truck} trip${tr.trips_per_truck > 1 ? 's' : ''}`);
  if (sh) parts.push(`${tr ? 'shut in' : 'Shut in'} ${sh.wells.map(w => w.replace(/^.*_/, '')).join(', ')} at +${sh.start_after_min} min`);
  return parts.join(' and ') || P.label;
};
function render() {
  const el = $('#app');
  const bar = (ttl, h1, sub) => `<div class="bar"><div class="ttl">${ttl}</div><h1>${h1}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  if (!view || view.error) { el.innerHTML = bar('TankFul', 'This link is not valid', esc(view && view.error)); return; }
  const a = view.alert, j = view.job, t = view.task, q = view.queue, now = unix(view.now_ts);
  const stateLine = s => ({ awaiting_approval: 'Waiting for your approval', awaiting_claim: 'Nobody has claimed this yet', claimed: 'Claimed', approved: 'Approved', in_progress: 'Plan in progress', awaiting_confirmation: 'Pump is off: leak status unknown until it runs again', resolved: 'Resolved', no_action_needed: 'No action needed', inspection_queued: 'In the inspection queue', watching: 'Watching', inspected: 'Inspected' }[s] || s);
  let h = '', btns = '', hero = '';
  if (view.kind === 'alert' && a) {
    const open = a.state === 'awaiting_approval' || a.state === 'awaiting_claim', done = a.state === 'resolved';
    const P = a.approved_plan || a.plan, sev = done ? 'ok' : a.severity;
    const tag = `<span class="sev ${sev}">${done ? 'RESOLVED' : esc(a.severity.toUpperCase())}</span> TankFul · ${esc(a.facility_id)} · replay ${hhmm(view.now_ts)} UTC`;
    if (a.category === 'pump_failure') {
      const by = unix(a.approve_by_ts), shut = a.hours_to_limit && a.hours_to_limit.p50 != null ? now + a.hours_to_limit.p50 * 3600 : null;
      const tr = P && (P.actions || []).find(x => x.type === 'dispatch_truck');
      hero = bar(tag, done ? `Resolved at ${esc(a.facility_id)}` : open ? `A pump failed. ${tr ? 'Approve the truck?' : 'Approve the plan?'}` : `A pump failed at ${esc(a.facility_id)}`, done ? 'The fault cleared. Nothing to do.' : shut ? `The tank shuts down at ${hmU(shut)} if nothing is done.` : stateLine(a.state));
      if (!done) h += `<div class="card"><div class="cap"><span>${open ? 'Decide by' : 'Status'}</span>${shut ? `<span>Shutdown <b>${hmU(shut)}</b></span>` : ''}</div>
        <div class="big ${open ? '' : 'ok plain'}">${open && by ? `${hmU(by)}<small>${a.minutes_to_approve != null ? a.minutes_to_approve + ' min left' : ''}</small>` : esc(stateLine(a.state)) + (a.claimed_by ? `<small>${esc(a.claimed_by)}</small>` : '')}</div>
        ${shut || by ? ruler(now, open ? by : null, shut) : ''}</div>`;
      if (P && !done) h += `<div class="todo ${open ? '' : 'done'}"><div class="k">${open ? 'What to do' : 'Approved plan'}</div><h2>${esc(planTitle(P))} · ${money(P.cost)}</h2>
        <p>${open ? 'Cheapest option.' : ''}${a.fallback && open ? ` Miss ${hhmm(a.approve_by_ts)} and the next best costs <b>${money(a.fallback.cost - P.cost)} more</b>.` : ''}${a.do_nothing_cost != null ? ` Doing nothing costs <b>${money(a.do_nothing_cost)}</b>.` : ''}</p></div>`;
      h += `<details><summary>Other options and the math</summary><div class="rows">
        ${P ? `<div class="row best"><span>${esc(P.label)}</span><b>${money(P.cost)}</b></div>` : ''}
        ${a.fallback ? `<div class="row"><span>If missed · ${esc(a.fallback.label)}</span><b>${money(a.fallback.cost)}</b></div>` : ''}
        ${a.do_nothing_cost != null ? `<div class="row"><span>Do nothing · shutdown</span><b>${money(a.do_nothing_cost)}</b></div>` : ''}
        <div class="row"><span>Shutdown in</span><b>${a.hours_to_limit && a.hours_to_limit.p50 != null ? Math.round(a.hours_to_limit.p50 * 60) + ' min' : '–'}</b></div>
        <div class="row"><span>Evidence</span><b style="font-family:inherit;font-weight:400;color:var(--ink-2);text-align:left">${esc((a.evidence || []).join('. '))}</b></div></div></details>`;
      if (open && !acted) btns = `<button class="primary" onclick="act('claim')">${tr ? 'Approve · send the truck' : 'Approve this plan'}</button><button onclick="act('decline')">Can't · hand to backup</button><button class="quiet" onclick="act('ack')">Acknowledge, stop re-pinging</button>`;
    } else {
      const leak = a.category === 'pipeline_leak';
      hero = bar(tag, done ? `Resolved at ${esc(a.facility_id)}` : leak ? `A pipeline is leaking. Can you look at it?` : `A pump is wearing out. Inspect it today?`, done ? '' : esc(stateLine(a.state)) + (a.claimed_by ? ` · ${esc(a.claimed_by)}` : ''));
      if (!done) h += `<div class="todo ${open ? (leak ? '' : 'calm') : 'done'}"><div class="k">${open ? 'What to do' : 'On it'}</div><h2>${leak ? 'Send an inspector to ' + esc(a.asset_id) : 'Inspect ' + esc(a.asset_id) + ' within 24 h'}</h2><p>${leak ? 'A leak\'s end can only be confirmed when the pump runs again.' : 'A repair now avoids an emergency truck later.'}</p></div>`;
      h += `<details><summary>Why the system thinks this</summary><div class="rows"><div class="row"><span style="color:var(--ink-2)">${esc((a.evidence || []).join('. '))}. Confidence ${Math.round((a.confidence || 0) * 100)}%.</span></div></div></details>`;
      if (open && !acted) btns = `<button class="primary" onclick="act('claim')">I'll take it</button><button onclick="act('decline')">Can't · hand to backup</button><button class="quiet" onclick="act('ack')">Acknowledge, stop re-pinging</button>`;
    }
  } else if (view.kind === 'job' && j) {
    const open = j.state === 'open', covered = j.state === 'covered' || j.state === 'done', left = j.trucks - j.claims.length;
    hero = bar(`<span class="sev ${open ? 'high' : 'ok'}">${open ? 'TRUCK' : 'COVERED'}</span> TankFul · ${esc(j.facility_id)} · replay ${hhmm(view.now_ts)} UTC`, open ? `A truck is needed at ${esc(j.facility_id)}. Can you go?` : covered ? 'Covered. Stand down.' : 'Plan changed: trucks no longer needed', open ? `${left} of ${j.trucks} truck${j.trucks > 1 ? 's' : ''} still needed · first to claim goes` : '');
    h += `<div class="card"><div class="cap"><span>Leave by</span>${a && a.hours_to_limit && a.hours_to_limit.p50 != null ? `<span>Shutdown <b>${hmU(now + a.hours_to_limit.p50 * 3600)}</b></span>` : ''}</div><div class="big ${open ? '' : 'ok plain'}">${hmU(j.claim_by_unix)}</div>${ruler(now, j.claim_by_unix, a && a.hours_to_limit && a.hours_to_limit.p50 != null ? now + a.hours_to_limit.p50 * 3600 : null)}</div>`;
    h += `<div class="rows"><div class="row"><span>Trips</span><b>${j.trips}</b></div><div class="row"><span>Claimed by</span><b style="font-family:inherit">${esc(j.claims.join(', ') || 'nobody yet')}</b></div></div>`;
    if (open && !acted) btns = `<button class="primary" onclick="act('claim')">Claim this truck</button><button onclick="act('decline')">Can't</button>`;
  } else if (view.kind === 'task' && t) {
    const done = t.state === 'done', due = t.state === 'due';
    hero = bar(`<span class="sev ${done ? 'ok' : 'critical'}">${done ? 'DONE' : 'SHUT-IN'}</span> TankFul · ${esc(t.facility_id)} · due ${hhmm(t.due_ts)} UTC`, done ? 'Done. Thank you.' : due ? `Shut in ${esc(t.wells.join(', '))} now` : `Shut in ${esc(t.wells.join(', '))} at ${hhmm(t.due_ts)}`, done ? '' : 'Part of the approved plan. Tap Done when the wells are off.');
    if (!done) h += `<div class="todo ${due ? 'bad' : 'calm'}"><div class="k">${due ? 'Do it now' : 'Scheduled'}</div><h2>Shut in ${esc(t.wells.join(', '))}</h2><p>Due ${hhmm(t.due_ts)} UTC at ${esc(t.facility_id)}.</p></div>`;
    if (!done && !acted) btns = `<button class="primary" onclick="act('done')">Wells are shut in</button>`;
  } else if (view.kind === 'queue' && q) {
    const done = q.state === 'done';
    hero = bar(`<span class="sev ${done ? 'ok' : 'low'}">${done ? 'DONE' : 'INSPECTION'}</span> TankFul · by ${hhmm(q.deadline_ts)} UTC`, done ? 'Inspected. Thank you.' : `Inspect ${esc(q.asset_id)} by ${hhmm(q.deadline_ts)}`, done ? '' : 'No rush, no re-pings.');
    if (!done) h += `<div class="todo calm"><div class="k">${q.state === 'assigned' ? 'Yours' : 'What to do'}</div><h2>Inspect ${esc(q.asset_id)}</h2><p>${esc(q.reason)}</p></div>`;
    if (q.state === 'queued' && !acted) btns = `<button class="primary" onclick="act('claim')">Take this inspection</button>`;
    else if (q.state === 'assigned' && !acted) btns = `<button class="primary" onclick="act('done')">Inspected</button>`;
  } else hero = bar('TankFul', esc(view.kind), '');
  if (result) h += `<div class="card result">${result.ok ? ({ approved: 'Approved. Trucks and shut-ins are being routed.', claimed: 'You have it.', covered: 'Covered by someone else. Stand down.', declined: 'Noted. It goes to the next person.', done: 'Done.' }[result.result] || esc(result.result)) : 'Problem: ' + esc(result.error)}${result.note ? `<div class="note">${esc(result.note)}</div>` : ''}</div>`;
  el.innerHTML = hero + `<main>${h}<div class="cta">${btns}</div><div class="foot">Signed in as ${esc(view.person)} · this page checks in every minute while open</div></main>`;
}
load().then(() => { const d = qs.get('do'); if (d && !acted && view && !view.error) act(d); });
</script>
</body>
</html>
