<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Box · How it works</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; color: #f2f4f8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #world { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 2.2vh 3vw 0; pointer-events: none; z-index: 3; }
  .step { font-size: clamp(11px, 1.05vw, 15px); font-weight: 800; letter-spacing: .12em; color: #ffcc33; }
  h1 { margin: .6vh 0 0; font-size: clamp(22px, 2.9vw, 46px); line-height: 1.1; max-width: 70vw; }
  .sub { margin: 1vh 0 0; font-size: clamp(14px, 1.35vw, 22px); color: #b7c0d4; max-width: 62vw; line-height: 1.4; }
  .sub b, h1 b { color: #ffcc33; }
  .fade { animation: fade .5s both; } @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
  .dots { position: fixed; top: 2.4vh; right: 3vw; display: flex; gap: 6px; z-index: 4; }
  .dots button { width: 34px; height: 6px; border: 0; border-radius: 3px; background: #2a3350; cursor: pointer; padding: 0; }
  .dots button.done { background: #5b6a92; } .dots button.on { background: #ffcc33; }
  footer { position: fixed; left: 0; right: 0; bottom: 2.4vh; display: flex; justify-content: center; gap: 10px; z-index: 4; }
  footer button { background: #1a2238; color: #e6e9f2; border: 1px solid #34406a; border-radius: 10px; padding: 10px 18px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  footer button:hover { border-color: #ffcc33; }
  footer button.primary { background: #ffcc33; color: #111; border-color: #ffcc33; min-width: 150px; }
  footer button.pulse { animation: pulse 1.2s infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 8px #ffcc3333; } }
  /* SVG classes */
  .flow { stroke-dasharray: 10 10; animation: flow .7s linear infinite; } .flow.off { animation: none; opacity: .25; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .nod { transform-box: fill-box; transform-origin: 50% 50%; animation: nod 1.6s ease-in-out infinite alternate; } .off .nod { animation: none; }
  @keyframes nod { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
  @keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
  .pop { transform-box: fill-box; transform-origin: center; animation: popin .35s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes popin { from { transform: scale(.3); opacity: 0; } }
  .blink { animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .3; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<svg id="world" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
<header><div class="step" id="step"></div><h1 id="head">Loading the oil field…</h1><p class="sub" id="sub"></p></header>
<div class="dots" id="dots"></div>
<footer>
  <button id="back">◀ Back</button>
  <button id="next" class="primary">Start ▶</button>
  <button id="auto">⏵ Autoplay: off</button>
  <button id="voice">🔇 Voice</button>
  <button id="fs">⛶ Full screen</button>
  <button onclick="location.href='index.html'">Live console →</button>
</footer>
<script src="model.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg', W = $('world');
const q = new URLSearchParams(location.search);
const fmt$ = v => '$' + Math.round(v).toLocaleString();
const hm = t => new Date(t * 1000).toISOString().slice(11, 16);
const dur = min => `${Math.floor(min / 60)}h ${String(Math.round(min % 60)).padStart(2, '0')}m`;
const C = { bg: '#0b1020', panel: '#141b31', line: '#2a3350', ink: '#f2f4f8', ink2: '#b7c0d4', muted: '#7d88a6', water: '#3d9bff', ok: '#2fd27a', warn: '#ffb020', bad: '#ff5464', gold: '#ffcc33', oil: '#c9a227' };
let ds, R, cur = -1, runId = 0, auto = q.has('auto'), voice = false;

// ---------- timing (setTimeout so background tabs / recorders don't stall) ----------
const tick = f => setTimeout(f, 16);
function wait(ms) { const my = runId; return new Promise((res, rej) => { const t0 = performance.now(); (function k() { if (my !== runId) return rej('stop'); performance.now() - t0 >= ms ? res() : tick(k); })(); }); }
function tween(ms, fn) { const my = runId; return new Promise((res, rej) => { const t0 = performance.now(); (function k() { if (my !== runId) return rej('stop'); const p = Math.min(1, (performance.now() - t0) / ms); fn(p); p < 1 ? tick(k) : res(); })(); }); }
const bg = p => p.catch(() => {}); // fire-and-forget animation
const ease = p => p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;

// ---------- SVG kit ----------
function el(tag, a = {}, parent = W) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; }
function txt(x, y, s, a = {}, parent = W) { const t = el('text', { x, y, fill: C.ink, 'font-size': 20, 'font-weight': 700, ...a }, parent); t.textContent = s; return t; }
function label(x, y, s, o = {}) { // rounded callout
  const fs = o.size || 18, w = s.length * fs * .56 + 24, g = el('g', { class: 'pop' }, o.parent || W);
  const ax = o.anchor === 'middle' ? x - w / 2 : o.anchor === 'end' ? x - w : x;
  el('rect', { x: ax, y: y - fs - 6, width: w, height: fs + 16, rx: 10, fill: o.fill || '#1d2642', stroke: o.stroke || C.line, 'stroke-width': 1.5 }, g);
  txt(ax + 12, y + 1, s, { 'font-size': fs, fill: o.color || C.ink }, g);
  return g;
}
function panel(x, y, w, h, title) { const g = el('g', { class: 'pop' }); el('rect', { x, y, width: w, height: h, rx: 16, fill: C.panel, stroke: C.line, 'stroke-width': 1.5 }, g); if (title) txt(x + 20, y + 34, title, { 'font-size': 17, fill: C.muted, 'letter-spacing': '.08em' }, g); return g; }
function jack(x, y, s = 1, parent = W) {
  const g = el('g', { transform: `translate(${x} ${y}) scale(${s})` }, parent);
  el('path', { d: 'M-16 0 L0 -30 L16 0', stroke: '#8a93b8', 'stroke-width': 4, fill: 'none' }, g);
  el('rect', { class: 'nod', x: -28, y: -37, width: 56, height: 8, rx: 4, fill: C.oil }, g);
  return g;
}
function tank(x, y, w, h, parent = W) {
  const g = el('g', {}, parent);
  el('rect', { x, y, width: w, height: h, rx: 10, fill: '#1b2340', stroke: '#6e78a3', 'stroke-width': 3 }, g);
  const fill = el('rect', { x: x + 4, y: y + h - 4, width: w - 8, height: 0, rx: 6, fill: C.water }, g);
  const sy = y + h * (1 - ds.lim.shutdown / 100);
  el('line', { x1: x - 14, x2: x + w + 14, y1: sy, y2: sy, stroke: C.bad, 'stroke-width': 3, 'stroke-dasharray': '8 6' }, g);
  const pct = txt(x + w / 2, y + h - 16, '', { 'text-anchor': 'middle', 'font-size': Math.max(16, w / 5), 'font-weight': 900 }, g);
  return { g, x, y, w, h, sy, set(p) { const hh = (h - 8) * Math.min(100, p) / 100; fill.setAttribute('y', y + h - 4 - hh); fill.setAttribute('height', hh); fill.setAttribute('fill', p >= ds.lim.shutdown - 1e-6 ? C.bad : p >= ds.lim.warning ? C.warn : C.water); pct.textContent = (p >= ds.lim.warning ? (Math.floor(Math.min(p, ds.lim.shutdown) * 10) / 10).toFixed(1) : p.toFixed(0)) + '%'; } };
}
function truck(x, y, s = 1, parent = W) {
  const g = el('g', { transform: `translate(${x} ${y})` }, parent), b = el('g', { transform: `scale(${s})` }, g);
  el('rect', { x: -38, y: -26, width: 50, height: 26, rx: 5, fill: '#e8ecf8' }, b);
  el('rect', { x: 12, y: -19, width: 22, height: 19, rx: 4, fill: C.gold }, b);
  el('rect', { x: 21, y: -15, width: 10, height: 7, fill: '#1b2340' }, b);
  el('circle', { cx: -24, cy: 2, r: 6, fill: '#111', stroke: '#aaa', 'stroke-width': 2 }, b);
  el('circle', { cx: 20, cy: 2, r: 6, fill: '#111', stroke: '#aaa', 'stroke-width': 2 }, b);
  return { g, at(nx, ny) { g.setAttribute('transform', `translate(${nx} ${ny})`); } };
}
function sensor(x, y, parent = W) { const g = el('g', {}, parent); el('circle', { class: 'ping', cx: x, cy: y, r: 10, fill: 'none', stroke: C.gold, 'stroke-width': 2 }, g); el('circle', { cx: x, cy: y, r: 8, fill: C.gold }, g); return g; }
function packet(x1, y1, x2, y2, ms = 900, color = C.gold) { const d = el('circle', { r: 6, fill: color }); return bg(tween(ms, p => { const e = ease(p); d.setAttribute('cx', x1 + (x2 - x1) * e); d.setAttribute('cy', y1 + (y2 - y1) * e - Math.sin(p * Math.PI) * 60); })).then(() => d.remove()); }
function brain(x, y) { // "Glass Box" model chip
  const g = el('g', { class: 'pop' });
  el('rect', { x: x - 70, y: y - 50, width: 140, height: 100, rx: 18, fill: '#10213f', stroke: '#4fb3ff', 'stroke-width': 3 }, g);
  for (let k = -2; k <= 2; k++) { el('line', { x1: x + k * 22, y1: y - 62, x2: x + k * 22, y2: y - 50, stroke: '#4fb3ff', 'stroke-width': 3 }, g); el('line', { x1: x + k * 22, y1: y + 50, x2: x + k * 22, y2: y + 62, stroke: '#4fb3ff', 'stroke-width': 3 }, g); }
  txt(x, y - 6, 'GLASS BOX', { 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: '#4fb3ff' }, g);
  txt(x, y + 20, 'model', { 'text-anchor': 'middle', 'font-size': 16, fill: C.ink2 }, g);
  return g;
}
function chart(x, y, w, h, opts) { // tiny line chart; returns plot(points) / mapping helpers
  const g = el('g', {});
  el('rect', { x, y, width: w, height: h, rx: 10, fill: '#0f1529', stroke: C.line }, g);
  const X = v => x + 14 + (v - opts.x0) / (opts.x1 - opts.x0) * (w - 28), Y = v => y + h - 12 - (v - opts.y0) / (opts.y1 - opts.y0) * (h - 24);
  return { g, X, Y };
}

function svgButton(x, y, w, h, text, sub, parent = W) {
  const g = el('g', { class: 'pop', style: 'cursor:pointer' }, parent);
  const r = el('rect', { x, y, width: w, height: h, rx: 14, fill: '#1d2642', stroke: '#5b6a92', 'stroke-width': 2 }, g);
  txt(x + 22, y + h / 2 + 8, text, { 'font-size': 24, 'font-weight': 800 }, g);
  txt(x + w - 20, y + h / 2 + 7, sub || '', { 'font-size': 18, fill: C.muted, 'text-anchor': 'end' }, g);
  g.onmouseenter = () => r.setAttribute('stroke', C.gold); g.onmouseleave = () => r.setAttribute('stroke', '#5b6a92');
  return g;
}
function choose(buttons) { // resolves with the index clicked; autoplay clicks the first untried one
  const my = runId; let done = false;
  return new Promise((res, rej) => {
    buttons.forEach((b, j) => b.onclick = () => { if (!done) { done = true; res(j); } });
    if (auto) setTimeout(() => { const j = buttons.findIndex(b => !b.dataset.tried); if (!done && j >= 0) { done = true; res(j); } }, 1600);
    (function k() { if (done) return; if (my !== runId) return rej('stop'); tick(k); })();
  });
}
function stamp(x, y, text, color) { const g = el('g', { class: 'pop', transform: `rotate(-5 ${x} ${y})` }); const w = text.length * 22 + 50; el('rect', { x: x - w / 2, y: y - 46, width: w, height: 70, rx: 12, fill: '#000000bb', stroke: color, 'stroke-width': 6 }, g); txt(x, y + 4, text, { 'text-anchor': 'middle', 'font-size': 38, 'font-weight': 900, fill: color }, g); return g; }
async function rewindFx(fn) {
  const g = el('g', {}); el('rect', { width: 1600, height: 900, fill: '#3fd0ff14' }, g);
  const lines = el('g', {}, g); for (let y = 0; y < 960; y += 16) el('rect', { x: 0, y, width: 1600, height: 3, fill: '#ffffff22' }, lines);
  txt(800, 470, '◀◀ REWIND', { 'text-anchor': 'middle', 'font-size': 72, 'font-weight': 900, fill: '#fff', 'letter-spacing': 8 }, g);
  await tween(1200, p => { lines.setAttribute('transform', `translate(0 ${-(p * 200) % 16})`); fn(p); });
  g.remove();
}

// ---------- geography: real coordinates from network.json ----------
function haversineMi([a, b], [c, d]) { const r = Math.PI / 180, s = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 2 * 3958.8 * Math.asin(Math.sqrt(s)); }
function projector(sys, box) {
  const pts = [sys.truck_yard, [sys.disposal_site.lat, sys.disposal_site.lon], ...sys.facilities.map(f => [f.lat, f.lon])];
  const la = pts.map(p => p[0]), lo = pts.map(p => p[1]), kx = Math.cos(la[0] * Math.PI / 180);
  const x0 = Math.min(...lo), x1 = Math.max(...lo), y0 = Math.min(...la), y1 = Math.max(...la);
  const sc = Math.min(box.w / ((x1 - x0) * kx), box.h / (y1 - y0));
  const ox = box.x + (box.w - (x1 - x0) * kx * sc) / 2, oy = box.y + (box.h - (y1 - y0) * sc) / 2;
  return (lat, lon) => [ox + (lon - x0) * kx * sc, oy + (y1 - lat) * sc];
}
function mapBase(sys, box, o = {}) {
  const P = projector(sys, box);
  for (let gx = box.x - 40; gx < box.x + box.w + 40; gx += 60) el('line', { x1: gx, x2: gx, y1: box.y - 40, y2: box.y + box.h + 40, stroke: '#141b31' });
  for (let gy = box.y - 40; gy < box.y + box.h + 40; gy += 60) el('line', { y1: gy, y2: gy, x1: box.x - 40, x2: box.x + box.w + 40, stroke: '#141b31' });
  const [dx, dy] = P(sys.disposal_site.lat, sys.disposal_site.lon), [yx, yy] = P(...sys.truck_yard);
  const pipes = {}, sites = {};
  for (const f of sys.facilities) { const [fx, fy] = P(f.lat, f.lon); pipes[f.id] = el('line', { x1: fx, y1: fy, x2: dx, y2: dy, stroke: C.water, 'stroke-width': 4, class: 'flow' }); }
  el('circle', { cx: dx, cy: dy, r: 22, fill: '#12304f', stroke: C.water, 'stroke-width': 3 }); txt(dx, dy + 7, '⬇', { 'text-anchor': 'middle', 'font-size': 20, fill: C.water });
  if (!o.quiet) txt(dx, dy + 46, 'Disposal site', { 'text-anchor': 'middle', 'font-size': 16, fill: C.ink2 });
  el('rect', { x: yx - 24, y: yy - 20, width: 48, height: 40, rx: 6, fill: '#2a2f45', stroke: C.gold, 'stroke-width': 3 }); el('path', { d: `M${yx - 28} ${yy - 18} L${yx} ${yy - 36} L${yx + 28} ${yy - 18}`, fill: 'none', stroke: C.gold, 'stroke-width': 3 });
  if (!o.quiet) txt(yx, yy + 42, 'Truck yard', { 'text-anchor': 'middle', 'font-size': 16, fill: C.ink2 });
  for (const f of sys.facilities) {
    const [fx, fy] = P(f.lat, f.lon), g = el('g', {});
    f.wells.forEach((w, k) => { const a = -Math.PI / 2 + (k - 1) * .7; el('line', { x1: fx + Math.cos(a) * 60, y1: fy + Math.sin(a) * 60, x2: fx, y2: fy, stroke: '#2c3a5e', 'stroke-width': 2 }, g); jack(fx + Math.cos(a) * 62, fy + Math.sin(a) * 62 + 10, .6, g); });
    el('rect', { x: fx - 20, y: fy - 22, width: 40, height: 44, rx: 6, fill: '#1b2340', stroke: '#6e78a3', 'stroke-width': 3 }, g);
    el('rect', { x: fx - 16, y: fy - 2, width: 32, height: 20, rx: 3, fill: C.water }, g);
    txt(fx, fy + 48, 'Facility ' + f.id.slice(-1), { 'text-anchor': 'middle', 'font-size': 16, fill: C.ink2 }, g);
    sites[f.id] = { g, x: fx, y: fy };
  }
  return { P, pipes, sites, yard: [yx, yy], disposal: [dx, dy] };
}

// ---------- tank physics for replays (minute steps, same rules as the model's planner) ----------
function ctxOf(f) { return { fac: f.fac, V0: f.level / 100 * f.fac.cap, lim: ds.lim.shutdown / 100 * f.fac.cap, rate: f.inflowBpd / 1440, wells: f.wells, H: f.H }; }
function sim(c, plan, t) {
  const tr = plan.actions.find(a => a.type === 'dispatch_truck'), sh = plan.actions.find(a => a.type === 'shut_in_wells');
  const cut = sh ? c.wells.filter(w => sh.wells.includes(w.id)).reduce((a, w) => a + w.bpd, 0) / 1440 : 0, cap = ds.ops.emergency_trucking.truck_capacity_bbl;
  let v = c.V0, tripAt = null, trips = 0;
  for (let m = 0; m < Math.min(t, c.H); m++) {
    if (tripAt == null) v += c.rate - (sh && m >= sh.start_after_min ? cut : 0);
    if (tripAt == null && v >= c.lim) { v = c.lim; tripAt = m + 1; }
    if (tr && trips < tr.trips_per_truck && m + 1 === c.fac.resp + trips * c.fac.cycle) { v -= Math.min(tr.trucks * cap, v); trips++; }
  }
  return { pct: v / c.fac.cap * 100, tripAt };
}

// ---------- the cases, picked from the data (works on any dataset) ----------
let K;
function prepare() {
  R = Model.weekReplay(ds);
  const ev = R.engine.events.find(e => { const p = R.plans.get(e.event_id); return p && p.freeTrucks === ds.ops.systems[e.system_id].emergency_fleet_size && p.doNothing.cost > 0 && p.plan.trucks > 0; })
    || R.engine.events.find(e => R.plans.get(e.event_id)?.doNothing.cost > 0);
  const i0 = (ev.onset_unix - ds.tel.t0) / Model.STEP, fleet = ds.ops.systems[ev.system_id].emergency_fleet_size;
  const fsx = Model.failureState(ds, ev, i0), trace = [];
  let t = performance.now(); for (let r = 0; r < 50; r++) Model.planOne(ds, fsx, fleet); const planMs = (performance.now() - t) / 50;
  const P = Model.planOne(ds, fsx, fleet, trace);
  const sys = ds.systems.find(s => s.id === ev.system_id), facJ = sys.facilities.find(f => f.id === ev.facility_id);
  const leak = R.engine.events.find(e => e.category === 'pipeline_leak'), wear = R.engine.events.find(e => e.category === 'pump_degradation');
  // three tanks, fewer trucks
  let c2 = null;
  const fails = R.engine.events.filter(e => e.category === 'pump_failure');
  for (const s of ds.systems) {
    const fs = fails.filter(e => e.system_id === s.id), fl = ds.ops.systems[s.id].emergency_fleet_size;
    for (const a of fs) { const grp = fs.filter(e => e.onset_unix >= a.onset_unix && e.onset_unix < (a.end_unix ?? Infinity)); if (grp.length > fl && (!c2 || grp.length > c2.grp.length)) c2 = { s, grp, fleet: fl }; }
  }
  if (c2) {
    const lastOn = Math.max(...c2.grp.map(e => e.onset_unix)), firstEnd = Math.min(...c2.grp.map(e => e.end_unix ?? Infinity));
    c2.tick = Math.min((lastOn + 7200 - ds.tel.t0) / 300, (firstEnd - ds.tel.t0) / 300 - 1, ds.tel.n - 1);
    const rep = Model.createReplay(ds); for (let k = 0; k <= c2.tick; k++) rep.step(k);
    t = performance.now(); for (let r = 0; r < 20; r++) Model.alertsAt(ds, rep.engine, c2.tick); c2.ms = (performance.now() - t) / 20;
    c2.items = Model.alertsAt(ds, rep.engine, c2.tick).failures.filter(f => f.fac.sys === c2.s.id);
    if (c2.items.length <= c2.fleet) c2 = null;
  }
  t = performance.now(); Model.weekReplay(ds); const weekMs = performance.now() - t;
  const fleetT = Model.fleetWhatIf(ds), rb = Model.rebalance(fleetT), mv = Model.maintenanceValue(R);
  K = { fleetT, rb, mv, ev, i0, fleet, fsx, trace, planMs, P, sys, facJ, fac: fsx.fac, leak, wear, c2, weekMs };
}

// ---------- voice: ElevenLabs via the local server (app/serve.mjs), browser voice as fallback ----------
let audio = null, speakSeq = 0, spoken = Promise.resolve(), endSpeech = () => {}, lastLine = '', eleven = false;
const forSpeech = t => t.replace(/<[^>]+>/g, '').replace(/÷/g, ' divided by ').replace(/×/g, ' times ').replace(/→/g, ' to ').replace(/\//g, ', ').replace(/\s+/g, ' ').trim();
function stopVoice() { speakSeq++; endSpeech(); if (audio) { audio.pause(); audio = null; } speechSynthesis.cancel(); }
function speak(raw) {
  stopVoice(); const my = speakSeq, text = forSpeech(raw);
  spoken = new Promise(done => {
    endSpeech = done;
    const browser = () => { if (my !== speakSeq) return done(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; u.onend = u.onerror = done; speechSynthesis.speak(u); };
    fetch('/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(b => { if (my !== speakSeq) return done(); audio = new Audio(URL.createObjectURL(b)); audio.onended = audio.onerror = done; audio.play().catch(browser); })
      .catch(browser);
  });
}
fetch('/tts/status').then(r => r.json()).then(j => { eleven = j.elevenlabs; $('voice').textContent = voice ? '🔊 Voice' : '🔇 Voice'; $('voice').title = eleven ? 'ElevenLabs voice' : 'ElevenLabs key not set: browser voice (cached clips still play)'; }).catch(() => { $('voice').title = 'Run app/serve.mjs for the ElevenLabs voice. Using the browser voice.'; });

// ---------- scenes ----------
function head(step, h, sub) {
  $('step').textContent = cur >= 0 && /^\d+ · /.test(step) ? `${cur + 1} · ` + step.replace(/^\d+ · /, '') : step; $('head').innerHTML = h; $('sub').innerHTML = sub || '';

  const k = +q.get('step') || 0; // ?step=4 jumps straight to a scene
  if (q.has('step') || auto) go(k - (q.has('step') ? 1 : 0));
  else { intro(); head('GLASS BOX · HOW IT WORKS', `How we keep Avon's oil field running, in <b>${scenes.length} short steps</b>`, `Everything you'll see runs live on <b>${ds.tel.rows.toLocaleString()}</b> real sensor readings. Press <b>Start</b>, or use the → arrow key.`); $('next').onclick = () => { $('next').onclick = () => go(cur >= scenes.length - 1 ? 0 : cur + 1); go(0); }; }
})();
</script>
